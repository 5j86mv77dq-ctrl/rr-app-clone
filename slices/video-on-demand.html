    // ═══ DOMINANT COLOR EXTRACTION + WCAG CONTRAST ═══
    function srgbToLinear(c) { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
    function relativeLuminance(r, g, b) { return 0.2126 * srgbToLinear(r) + 0.7152 * srgbToLinear(g) + 0.0722 * srgbToLinear(b); }
    function contrastRatio(r, g, b) { const L = relativeLuminance(r, g, b); return 1.05 / (L + 0.05); } // contrast vs white
    function rgbToHex(r, g, b) { return "#" + [r, g, b].map(c => Math.round(c).toString(16).padStart(2, "0")).join(""); }

    function extractDominantColor(imgSrc, callback) {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => {
        const canvas = document.createElement("canvas");
        const size = 50;
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, size, size);
        const data = ctx.getImageData(0, 0, size, size).data;
        // Quantized histogram — bucket each channel into 16 levels
        const buckets = {};
        for (let i = 0; i < data.length; i += 16) { // sample every 4th pixel (16 = 4px * 4 channels)
          const r = data[i], g = data[i + 1], b = data[i + 2], a = data[i + 3];
          if (a < 128) continue; // skip transparent
          const sum = r + g + b;
          if (sum > 680 || sum < 30) continue; // skip near-white and near-black
          const key = (Math.floor(r / 16) << 8) | (Math.floor(g / 16) << 4) | Math.floor(b / 16);
          buckets[key] = (buckets[key] || { count: 0, r: 0, g: 0, b: 0 });
          buckets[key].count++; buckets[key].r += r; buckets[key].g += g; buckets[key].b += b;
        }
        let best = null, bestCount = 0;
        for (const key in buckets) {
          if (buckets[key].count > bestCount) { bestCount = buckets[key].count; best = buckets[key]; }
        }
        if (!best) { callback("#2c3e50"); return; }
        let r = best.r / best.count, g = best.g / best.count, b = best.b / best.count;
        // Enforce WCAG AA contrast (4.5:1) with white — darken if needed
        if (contrastRatio(r, g, b) < 4.5) {
          let lo = 0, hi = 1;
          for (let i = 0; i < 20; i++) { // binary search for darkening factor
            const mid = (lo + hi) / 2;
            if (contrastRatio(r * mid, g * mid, b * mid) >= 4.5) lo = mid; else hi = mid;
          }
          r *= lo; g *= lo; b *= lo;
        }
        callback(rgbToHex(r, g, b));
      };
      img.onerror = () => callback("#2c3e50");
      img.src = imgSrc;
    }

                <div style={{ position: "absolute", top: 0, left: 0, width: "100%", height: "100%", background: "rgba(0,0,0,0.2)", zIndex: 1 }} />
                <div style={{ width: 56, height: 56, borderRadius: "50%", background: wC.live, display: "flex", alignItems: "center", justifyContent: "center", boxShadow: "0 4px 16px rgba(212,51,51,0.25)", position: "relative", zIndex: 2 }}>
                  <WatchPlayFill size={24} />
                </div>
                <div style={{ position: "absolute", top: 12, right: 12, display: "flex", alignItems: "center", gap: 5, background: wC.live, borderRadius: 20, padding: "4px 12px", zIndex: 2 }}>
                  <div style={{ width: 6, height: 6, borderRadius: "50%", background: "#fff", animation: "pulse 2s ease-in-out infinite" }} />
                  <span style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 10, fontWeight: 800, color: "#fff", letterSpacing: 1 }}>LIVE</span>

        {/* Featured Tiles Row */}
        <div style={{ padding: "10px 10px 0" }}>

            {[
              { label: "Listen Live", image: "rr_shows/morning_air.jpg" },

        {/* Hero Article Card — 6 design variants */}
        {(() => {
          const swipeHandlers = {

            onTouchEnd: e => {
              if (articleTouchX.current === null) return;
              const diff = articleTouchX.current - e.changedTouches[0].clientX;
              if (Math.abs(diff) > 40) {
                if (diff > 0) setArticleIdx(i => (i + 1) % articleData.length);

          return (
            <div style={{ marginTop: 14, padding: "0 16px" }}>

              <div {...swipeHandlers} style={{ borderRadius: 16, overflow: "hidden", boxShadow: wC.shadow, border: "1px solid " + wC.border, cursor: "pointer" }}>

                  <div style={{ background: headerColor, padding: "16px 16px 8px", flexShrink: 0 }}>

                    <p style={{ margin: "4px 0 0", fontFamily: "'DM Sans', sans-serif", fontSize: 12, color: "rgba(255,255,255,0.85)", fontWeight: 500 }}>{art.source} · 3 min read</p>
                  </div>
                  <div style={{ flex: 1, position: "relative", overflow: "hidden" }}>

                    <img src={art.image} alt={art.title} style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} />

        {/* Continue Listening — audio resume on Home (account-gated, PRD §5).
            THREE stacked full-width rows, not a scroll row: a stacked list reads correctly at
            one, two or three items, with no empty cell to design around.
            Inset 16px, flush with Articles and every other Home section — the block was briefly
            set at 24px to hold it apart from the shelves below; it just read as misaligned. */}
        {(() => {
          const rows = (
            <div style={{ display: "flex", flexDirection: "column", gap: 8, padding: signedIn ? "0 16px" : 0 }}>

          );
          return (
            <div style={{ marginTop: 18 }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "0 16px", marginBottom: 8 }}>

                </div>
                {signedIn && <div onClick={() => onNavigate && onNavigate("listeningHistory")} style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 11, color: colors.accent, fontWeight: 600, cursor: "pointer", letterSpacing: 0.3 }}>See All →</div>}
              </div>
              {signedIn ? rows : <AccountGate headline="Save your place" sub="Login or create your free account." onJoin={onJoin} margin="0 16px">{rows}</AccountGate>}
            </div>

        })()}

      </div>
    );
    };

    // ═══ WATCH TAB — ICONS ═══
    const WatchSearchIcon = ({ size = 16 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></svg>
    );
    const WatchPlayFill = ({ size = 20, color = "#fff" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none"><path d="M8 5.14v13.72a1 1 0 001.5.86l11.04-6.86a1 1 0 000-1.72L9.5 4.28A1 1 0 008 5.14z" fill={color} /></svg>
    );

    // ═══ WATCH TAB — PRIMITIVES ═══
    // GREEN IS LIVE-ONLY. It means "on the air right now" — the LIVE badge and the Now Playing
    // bar. It must never mean "you paused here"; those two states cannot share a colour.
    const WATCH_GREEN = "#2e7d32";
    // Progress/resume accent. Everything that means "you stopped here" is this blue.
    const WATCH_PROGRESS = "#3b6fa0";

    // NOTHING IS PRINTED ON ARTWORK — no progress bars, no duration stamps, no play buttons.
    // Progress is information, so it lives in the text block: an in-flow 4px track that flexes
    // to fill its row, sitting below the meta line. Returning null below progress 0 is the
    // "not started" state — do not give it a zero-width fill instead.
    // HEIGHT IS COUPLED: the reserved spacer on unstarted episode rows must match this exactly
    // (search "RESERVED TRACK SPACE"). Change one and you must change the other.
    const WatchProgressBar = ({ progress }) => {
      if (!progress || progress <= 0) return null;
      return (
        <div style={{ flex: 1, minWidth: 0, height: 4, borderRadius: 2, background: "rgba(22,32,44,0.13)", overflow: "hidden" }}>
          <div style={{ width: (Math.min(progress, 1) * 100) + "%", height: "100%", borderRadius: 2, background: WATCH_PROGRESS }} />
        </div>
      );
    };

    // TIME FORMAT — abbreviated, no comma: 17min · 1hr 26min · 7hr 53min.
    const fmtMins = (m) => {
      const t = Math.max(1, Math.round(m)), h = Math.floor(t / 60), r = t % 60;
      return h ? (r ? h + "hr " + r + "min" : h + "hr") : r + "min";
    };
    // WHETHER "left" APPEARS IS DECIDED BY WIDTH. This is deliberate — do not "fix" one to
    // match the other. Full-width rows have room ("4hr 28min left", "Feb 21 · 7min left");
    // the 155px Continue Watching card does not — the word costs ~20px of track, and the
    // section header already supplies the meaning, so that card reads "17min".

    // Resume row: the track flexes to fill, the time sits at its end. Used wherever a card
    // shows progress inline (Continue Watching cards, Continue Listening rows).
    const WatchResumeRow = ({ progress, value, size = 10, gap = 6, marginTop = 6 }) => (
      <div style={{ display: "flex", alignItems: "center", gap, marginTop }}>
        <WatchProgressBar progress={progress} />
        {value ? <span style={{ flexShrink: 0, fontFamily: "'DM Sans', sans-serif", fontSize: size, color: wC.text1, whiteSpace: "nowrap" }}>{value}</span> : null}
      </div>
    );

    // Full-width track on its own line, below the meta line (series page: Continue Watching
    // card and episode rows).
    const WatchTrackLine = ({ progress }) => (
      <div style={{ display: "flex", marginTop: 5 }}><WatchProgressBar progress={progress} /></div>
    );

    // ═══ WATCH TAB — BADGE, EPISODE CARD, SECTION HEADER, SCROLL ROW ═══
    const WATCH_BADGE_STYLES = {
      live: { bg: wC.live, color: "#fff", label: "LIVE", dot: true },
      upnext: { bg: "rgba(46,125,76,0.85)", color: "#fff", label: "UP NEXT" },
      new: { bg: "rgba(26,107,58,0.85)", color: "#fff", label: "NEW" },
    };
    const WatchBadge = ({ type }) => {
      if (!type || !WATCH_BADGE_STYLES[type]) return null;
      const s = WATCH_BADGE_STYLES[type];
      return (
        <div style={{ position: "absolute", top: 6, right: 6, display: "flex", alignItems: "center", gap: 3, background: s.bg, borderRadius: 20, padding: "2px 8px" }}>
          {s.dot && <div style={{ width: 5, height: 5, borderRadius: "50%", background: "#fff", animation: "pulse 2s ease-in-out infinite" }} />}
          <span style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 7, fontWeight: 700, color: s.color, letterSpacing: 0.5 }}>{s.label}</span>
        </div>
      );
    };

    // TWO TREATMENTS, ONE CARD. Both are two lines and both leave the artwork unmarked.
    //   Resume (Continue Watching) — pass `progress` + `timeLeft`: title, then track and time.
    //     No show name and no subtitle: the artwork carries which series it belongs to.
    //   Browse (New Episodes)      — pass `showName` + `duration`: title, then "show · runtime".
    const WatchEpisodeCard = ({ title, showName, duration, timeLeft, badge, progress, color, image, onClick }) => (
      <div onClick={onClick} style={{ flexShrink: 0, width: 155, borderRadius: 12, overflow: "hidden", background: wC.card, border: "1px solid " + wC.border, boxShadow: wC.shadow, cursor: "pointer" }}>
        <div style={{ aspectRatio: "16/9", background: color || wC.surface, display: "flex", alignItems: "center", justifyContent: "center", position: "relative" }}>
          {image && <img src={image} style={{ position: "absolute", top: 0, left: 0, width: "100%", height: "100%", objectFit: "cover" }} />}
          {!image && <WatchPlayFill size={16} color="rgba(0,0,0,0.08)" />}
          <WatchBadge type={badge} />
        </div>
        {/* Top padding is 9, not 8: the extra pixel of air under the artwork widens the gap
            ABOVE the title, which strengthens the title↔progress grouping without pushing the
            progress row further from the title. Adding space below would trade one against the
            other. Applies to both card modes — they're one family. */}
        <div style={{ padding: "9px 10px 10px" }}>
          {/* Title size is shared with the browse card — resume and browse cards sit on
              adjacent rows, so they read as one card family. Tried 14px here to match the
              Continue Listening rows; it looked wrong next to New Episodes. */}
          <p style={{ margin: 0, fontFamily: "'DM Sans', sans-serif", fontSize: 11, fontWeight: 700, color: wC.text1, lineHeight: 1.25, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{title}</p>
          {/* PROXIMITY: the title and its progress row are one unit, so the gap between them
              must be visibly smaller than the gap above the title. At the default 6 they came
              out optically 11.9px apart against 9.4px above — the title read as belonging to
              the artwork instead. The row also centres a 3px track in a ~11px line box, which
              adds ~4px of its own, so this margin carries almost none of the spacing. */}
          {progress > 0
            ? <WatchResumeRow progress={progress} value={timeLeft} size={9.5} marginTop={3} />
            : <WatchMetaLine size={10} left={showName} right={duration} />}
        </div>
      </div>
    );

    // No padlock on signed-out sections. A lock reads as paywall, and every one of these
    // features is free — the gate card already explains itself in words (Peter, 2026-08-13).
    // `pad` exists because the series page runs on an 18px gutter, not Watch home's 16px.
    const WatchSectionHeader = ({ title, right, onRightClick, pad = "0 16px" }) => (
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: pad, marginBottom: 8 }}>
        <span style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <span style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 18, fontWeight: 800, color: wC.text1 }}>{title}</span>
        </span>
        {/* See-All links use the accent blue, matching the "All Titles →" pattern */}
        {right && <div onClick={onRightClick} style={{ display: "flex", alignItems: "center", gap: 2, fontFamily: "'DM Sans', sans-serif", color: "#3b6fa0", fontSize: 11, fontWeight: 600, cursor: "pointer" }}>{right}</div>}
      </div>
    );

    const WatchSeriesCard = ({ title, subtitle, host, episodes, gradient, badge, image, onClick }) => (
      <div onClick={onClick} style={{ flexShrink: 0, width: 220, borderRadius: 12, overflow: "hidden", background: wC.card, border: "1px solid " + wC.border, boxShadow: wC.shadow, cursor: "pointer" }}>
        <div style={{ aspectRatio: "16/9", background: gradient || wC.surface, display: "flex", alignItems: "center", justifyContent: "center", position: "relative" }}>
          {image && <img src={image} style={{ position: "absolute", top: 0, left: 0, width: "100%", height: "100%", objectFit: "cover" }} />}
          {!image && <WatchPlayFill size={22} color="rgba(0,0,0,0.08)" />}
          <WatchBadge type={badge} />
        </div>
        {/* Title, then "host · N episodes" — matches the All Series grid card exactly. */}
        <div style={{ padding: "10px 12px 12px" }}>
          <p style={{ margin: 0, fontFamily: "'DM Sans', sans-serif", fontSize: 12, fontWeight: 700, color: wC.text1, lineHeight: 1.25, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{title}</p>
          <WatchMetaLine size={11} left={host} right={episodes ? episodes + " " + (episodes === 1 ? "episode" : "episodes") : null} />
        </div>
      </div>
    );

    const WatchScrollRow = ({ children }) => (
      <div style={{ display: "flex", gap: 10, overflowX: "auto", padding: "0 16px 4px", scrollbarWidth: "none" }} className="hide-scrollbar">{children}</div>
    );

    // ONE LEFT-ALIGNED STRING, slots joined by "·":
    //   "Feb 21 · 7min left"        episodic series → date
    //   "Ep. 3 · 7min left"         sequential series → episode number
    //   "The Vatican Today · 27:14" browse cards → identity · quantity
    // The left slot truncates with an ellipsis; the "· value" tail never shrinks. There is no
    // right-alignment and no bold on the tail — half-bold inside a bullet-joined phrase reads
    // as a typo. (Replaces the two-slot space-between system from 51106c4 — Peter, 2026-08-13.)
    const WatchMetaLine = ({ left, right, size = 10 }) => (
      <div style={{ display: "flex", alignItems: "baseline", minWidth: 0, marginTop: 3, fontFamily: "'DM Sans', sans-serif", fontSize: size, color: wC.text1 }}>
        <span style={{ minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{left}</span>
        {right ? <span style={{ flexShrink: 0, whiteSpace: "nowrap" }}>&nbsp;·&nbsp;{right}</span> : null}
      </div>
    );

    // ═══ ACCOUNT GATE — bounded module: card container + blurred real content + white scrim (PRD §5) ═══
    const AccountGate = ({ headline, sub, onJoin, children, margin = "0 16px", pad = "10px 0" }) => (
      <div style={{ position: "relative", margin, borderRadius: 16, overflow: "hidden", background: "#fff", border: "1px solid rgba(22,32,44,0.09)", boxShadow: "0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04)" }}>
        <div aria-hidden="true" style={{ filter: "blur(7px)", pointerEvents: "none", userSelect: "none", padding: pad }}>{children}</div>
        <div style={{ position: "absolute", inset: 0, background: "rgba(255,255,255,0.82)" }} />
        <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 7, padding: "0 28px", textAlign: "center" }}>
          <p style={{ margin: 0, fontFamily: "'DM Sans', sans-serif", fontSize: 17, fontWeight: 800, color: "#16202c", lineHeight: 1.2, letterSpacing: -0.3 }}>{headline}</p>
          {sub && <p style={{ margin: 0, fontFamily: "'DM Sans', sans-serif", fontSize: 12, color: "#3c4652", fontWeight: 500 }}>{sub}</p>}
          <div onClick={onJoin} style={{ marginTop: 5, display: "inline-flex", alignItems: "center", gap: 7, background: "#3b6fa0", borderRadius: 999, padding: "10px 22px", cursor: "pointer", boxShadow: "0 6px 16px rgba(59,111,160,0.38)" }}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 13, fontWeight: 800, color: "#fff", letterSpacing: 0.2 }}>Sign up or log in</span>
          </div>
        </div>
      </div>
    );

    // ═══ WATCH TAB — HERO BILLBOARD ═══
    const HERO_SLIDES = [
      { title: "Lenten Lessons on the Mass", subtitle: "Fr. Rocky · 40 episodes", gradient: "linear-gradient(140deg, #EDE6F5, #D8CEE8)", seriesId: "lenten-mass", image: "visual_elements/watch_tab/LLOTM_v1_SERIES_CARD.jpg" },

                </div>
              ) : (seriesHits.length === 0 && episodeHits.length === 0) ? (
                <div style={{ padding: "58px 40px 0", textAlign: "center" }}>
                  <p style={{ margin: 0, fontFamily: "'DM Sans', sans-serif", fontSize: 15, fontWeight: 700, color: wC.text1 }}>No results for “{watchSearch.trim()}”</p>

              ) : (
                <React.Fragment>
                  {seriesHits.length > 0 && (
                    <React.Fragment>
                      <p style={{ margin: "14px 0 8px", padding: "0 18px", fontFamily: "'DM Sans', sans-serif", fontSize: 11, fontWeight: 700, color: wC.text3, letterSpacing: 1, textTransform: "uppercase" }}>Series · {seriesHits.length}</p>
                      {seriesHits.map(s => (
                        <div key={s.id} onClick={() => onTapSeries(s.id)} style={{ display: "flex", gap: 10, padding: "8px 18px", cursor: "pointer", borderBottom: "1px solid " + wC.border }}>
                          <div style={{ width: 110, height: 64, borderRadius: 8, flexShrink: 0, background: s.gradient, position: "relative", overflow: "hidden", display: "flex", alignItems: "center", justifyContent: "center" }}>
                            {SERIES_IMAGES[s.id] && SERIES_IMAGES[s.id][0] && <img src={SERIES_IMAGES[s.id][0]} style={{ position: "absolute", top: 0, left: 0, width: "100%", height: "100%", objectFit: "cover" }} />}
                            <WatchPlayFill size={18} color="rgba(0,0,0,0.12)" />
                          </div>
                          <div style={{ flex: 1, minWidth: 0, display: "flex", flexDirection: "column", justifyContent: "center" }}>
                            <p style={{ margin: 0, fontFamily: "'DM Sans', sans-serif", fontSize: 13, fontWeight: 600, color: wC.text1, lineHeight: 1.25, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{s.title}</p>
                            <WatchMetaLine size={11} left={s.host} right={s.episodes + " " + (s.episodes === 1 ? "episode" : "episodes")} />
                          </div>
                        </div>
                      ))}
                    </React.Fragment>
                  )}
                  {episodeHits.length > 0 && (
                    <React.Fragment>
                      <p style={{ margin: "18px 0 8px", padding: "0 18px", fontFamily: "'DM Sans', sans-serif", fontSize: 11, fontWeight: 700, color: wC.text3, letterSpacing: 1, textTransform: "uppercase" }}>Episodes · {episodeHits.length}</p>
                      {episodeHits.slice(0, 20).map(({ ep, series }, i) => (
                        <div key={series.id + "-" + ep.id} onClick={() => onPlayVideo && onPlayVideo(ep.title, series.title)} style={{ display: "flex", gap: 10, padding: "8px 18px", cursor: "pointer", borderBottom: "1px solid " + wC.border }}>
                          <div style={{ width: 110, height: 64, borderRadius: 8, flexShrink: 0, background: series.gradient, position: "relative", overflow: "hidden", display: "flex", alignItems: "center", justifyContent: "center" }}>
                            {SERIES_IMAGES[series.id] && SERIES_IMAGES[series.id][0] && <img src={SERIES_IMAGES[series.id][0]} style={{ position: "absolute", top: 0, left: 0, width: "100%", height: "100%", objectFit: "cover" }} />}
                            <WatchPlayFill size={18} color="rgba(0,0,0,0.12)" />
                          </div>
                          <div style={{ flex: 1, minWidth: 0, display: "flex", flexDirection: "column", justifyContent: "center" }}>
                            <p style={{ margin: 0, fontFamily: "'DM Sans', sans-serif", fontSize: 13, fontWeight: 600, color: wC.text1, lineHeight: 1.25, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{ep.title}</p>
                            <WatchMetaLine size={11} left={series.title} right={ep.duration} />
                          </div>
                        </div>
                      ))}
                      {episodeHits.length > 20 && (
                        <p style={{ margin: "12px 0 0", padding: "0 18px", textAlign: "center", fontFamily: "'DM Sans', sans-serif", fontSize: 12, color: wC.text2 }}>Showing 20 of {episodeHits.length} episodes</p>
                      )}

          ) : (
          <React.Fragment>
          {/* Hero Billboard */}
          <HeroBillboard liveNow={liveNow} upcomingPrayer={upcomingPrayer} upcomingCountdown={upcomingCountdown} reminders={reminders} toggleReminder={toggleReminder} onTapSeries={onTapSeries} onPlayVideo={onPlayVideo} signedIn={signedIn} />

          {/* Prayer Cards */}
          <WatchPrayerCards simHour={simHour} simMin={simMin} onTapSeries={onTapSeries} reminders={reminders} toggleReminder={toggleReminder} />
          <div style={{ height: 16 }} />
          {/* Continue Watching — account-gated (PRD §5) */}
          <WatchSectionHeader title="Continue Watching" />
          {(() => {
            const row = (
              <WatchScrollRow>
                {/* Resume cards: no "left" — the 155px card can't spare the ~20px, and the
                    section header above already says Continue Watching. */}
                <WatchEpisodeCard title="The Meaning of Love" timeLeft="17min" progress={0.38} color="#E8E4F0" image="visual_elements/watch_tab/fulton_sheen.png" onClick={() => onPlayVideo && onPlayVideo("The Meaning of Love", "Life Is Worth Living")} />
                <WatchEpisodeCard title="Fatherhood" timeLeft="9min" progress={0.72} color="#E8E4E0" image="visual_elements/watch_tab/into_the_breach.png" onClick={() => onPlayVideo && onPlayVideo("Fatherhood", "Into the Breach")} />
                <WatchEpisodeCard title="A Journey Up the Mountain" timeLeft="1hr 26min" progress={0.09} color="#D8D4CC" image="visual_elements/watch_tab/ApparitionHill.jpg" onClick={() => onPlayVideo && onPlayVideo("A Journey Up the Mountain", "Apparition Hill")} />
                <WatchEpisodeCard title="Eucharistic Congress, Day 2" timeLeft="2hr 15min" progress={0.22} color="#DCD8D0" image="visual_elements/watch_tab/FaceofMercy.jpg" onClick={() => onPlayVideo && onPlayVideo("Eucharistic Congress, Day 2", "National Eucharistic Congress")} />
              </WatchScrollRow>
            );
            return signedIn ? row : <AccountGate headline="Save your place" sub="Login or create your free account." onJoin={onJoin}>{row}</AccountGate>;
          })()}
          <div style={{ height: 16 }} />
          {/* New Episodes */}
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "0 16px", marginBottom: 8 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 18, fontWeight: 800, color: wC.text1 }}>New Episodes</span>
            </div>
          </div>
          <WatchScrollRow>
            {/* Browse cards: show name is back — nothing is started, so there's no track. */}
            <WatchEpisodeCard title="Pope Leo's Lenten Message" showName="The Vatican Today" duration="27:14" color="#D8E4F0" image="visual_elements/watch_tab/pope_leo.png" onClick={() => onPlayVideo && onPlayVideo("Pope Leo's Lenten Message", "The Vatican Today")} />
            <WatchEpisodeCard title="Tuesday of the 7th Week" showName="Holy Mass" duration="42:08" color="#E8E0D4" image="visual_elements/watch_tab/Daily_Mass.jpeg" onClick={() => onPlayVideo && onPlayVideo("Tuesday of the 7th Week", "Holy Mass")} />
            <WatchEpisodeCard title="Sunday Feb 23" showName="5-Minute Homilies" duration="5:12" color="#E4F0E8" image="visual_elements/watch_tab/5-MinuteHomilies_MaybeICanGetAMiracleToo_v2 1.png" onClick={() => onPlayVideo && onPlayVideo("Sunday Feb 23", "5-Minute Homilies")} />

          </WatchScrollRow>
          <div style={{ height: 16 }} />
          {/* Featured Series */}
          <WatchSectionHeader title="Featured Series" right="All Series →" onRightClick={() => onNavigate("allSeries")} />
          <WatchScrollRow>
            <WatchSeriesCard title="SEEK 2026" host="FOCUS" episodes={24} gradient="linear-gradient(140deg, #E8E0F0, #D0C8E0)" image="visual_elements/watch_tab/SEEK_2026.jpg" onClick={() => onTapSeries("seek-2026")} />
            <WatchSeriesCard title="Life Is Worth Living" host="Bp. Fulton Sheen" episodes={60} gradient="linear-gradient(140deg, #E8E4F0, #D8D0E8)" image="visual_elements/watch_tab/fulton_sheen.png" onClick={() => onTapSeries("fulton-sheen")} />
            <WatchSeriesCard title="Into the Breach" host="Knights of Columbus" episodes={8} gradient="linear-gradient(140deg, #E8E4E0, #D8D0C8)" image="visual_elements/watch_tab/into_the_breach.png" onClick={() => onTapSeries("into-the-breach")} />
          </WatchScrollRow>
          <div style={{ height: 16 }} />
          {/* Fr. Rocky Teaching */}
          <WatchSectionHeader title="Fr. Rocky Teaching" />
          <WatchScrollRow>
            <WatchSeriesCard title="Lessons on the Mass" host="Fr. Rocky" episodes={40} gradient="linear-gradient(140deg, #EDE6F5, #D8CEE8)" image="visual_elements/watch_tab/LLOTM_v1_SERIES_CARD.jpg" onClick={() => onTapSeries("lenten-mass")} />
            <WatchSeriesCard title="Lessons on the Sacraments" host="Fr. Rocky" episodes={40} gradient="linear-gradient(140deg, #E6EDF5, #CED8E8)" image="visual_elements/watch_tab/LLOTS.png" onClick={() => onTapSeries("lenten-sacraments")} />
            <WatchSeriesCard title="Eucharistic Encounters" host="Fr. Rocky" episodes={12} gradient="linear-gradient(140deg, #F0E8DC, #E0D4C0)" image="visual_elements/watch_tab/EE.png" onClick={() => onTapSeries("eucharistic-encounters")} />
          </WatchScrollRow>
          <div style={{ height: 16 }} />
          {/* Relevant Radio Live Prayer */}
          <WatchSectionHeader title="Relevant Radio Live Prayer" />
          <WatchScrollRow>
            <WatchSeriesCard title="Family Rosary Across America" host="Fr. Rocky" episodes={230} gradient="linear-gradient(170deg, #5B6B4F, #2A3B22)" image="visual_elements/watch_tab/Family_Rosary.jpeg" onClick={() => onTapSeries("family-rosary")} />
            <WatchSeriesCard title="The Divine Mercy Chaplet" host="Drew Mariani" episodes={160} gradient="linear-gradient(170deg, #4F6275, #253A4D)" image="visual_elements/watch_tab/Divine_Mercy_Chaplet.jpeg" onClick={() => onTapSeries("divine-mercy")} />
            <WatchSeriesCard title="Holy Mass" host="Fr. Rocky" episodes={180} gradient="linear-gradient(170deg, #7A6B52, #3D3528)" image="visual_elements/watch_tab/Daily_Mass.jpeg" onClick={() => onTapSeries("daily-mass")} />
          </WatchScrollRow>
          <div style={{ height: 16 }} />
          {/* Relevant Radio Shows */}
          <WatchSectionHeader title="Relevant Radio Shows" />
          <WatchScrollRow>
            <WatchSeriesCard title="The Vatican Today" host="Relevant Radio" episodes={4} gradient="linear-gradient(140deg, #D8E4F0, #C0D0E8)" image="visual_elements/watch_tab/vatican_today.png" onClick={() => onTapSeries("vatican-today")} />
            <WatchSeriesCard title="Patrick Madrid" host="Patrick Madrid" episodes={10} gradient="linear-gradient(140deg, #F0E8E4, #E0D4CC)" image="visual_elements/watch_tab/PatrickMadrid_v1.jpg" onClick={() => onTapSeries("patrick-madrid")} />
            <WatchSeriesCard title="Trending with Timmerie" host="Timmerie Millington" episodes={22} gradient="linear-gradient(140deg, #F0E4E8, #E8D0D8)" onClick={() => onTapSeries("timmerie")} />
          </WatchScrollRow>
          <div style={{ height: 16 }} />
          {/* Conferences & Events */}
          <WatchSectionHeader title="Conferences & Events" />
          <WatchScrollRow>
            <WatchSeriesCard title="National Eucharistic Congress" host="NEC" episodes={12} gradient="linear-gradient(140deg, #F0E8DC, #E0D4C0)" image="visual_elements/watch_tab/NEC.png" onClick={() => onTapSeries("eucharistic-encounters")} />
            <WatchSeriesCard title="SEEK 2026" host="FOCUS" episodes={24} gradient="linear-gradient(140deg, #E8E0F0, #D0C8E0)" image="visual_elements/watch_tab/SEEK_2026.jpg" onClick={() => onTapSeries("seek-2026")} />
            <WatchSeriesCard title="SEEK 2025" host="FOCUS" episodes={9} gradient="linear-gradient(140deg, #E0D8F0, #D0C8E0)" onClick={() => onTapSeries("seek-2025")} />
          </WatchScrollRow>
          <div style={{ height: 16 }} />
          {/* Formation */}
          <WatchSectionHeader title="Formation" />
          <WatchScrollRow>
            <WatchSeriesCard title="Into the Breach" host="Knights of Columbus" episodes={8} gradient="linear-gradient(140deg, #E8E4E0, #D8D0C8)" image="visual_elements/watch_tab/into_the_breach.png" onClick={() => onTapSeries("into-the-breach")} />
            <WatchSeriesCard title="The Quest" host="University of Dallas" episodes={11} gradient="linear-gradient(140deg, #E8E0D4, #D4CCB8)" onClick={() => onTapSeries("the-quest")} />
          </WatchScrollRow>
          <div style={{ height: 16 }} />
          {/* Documentaries & Films */}
          <WatchSectionHeader title="Documentaries & Films" />
          <WatchScrollRow>
            <WatchSeriesCard title="Pray: Patrick Peyton" host="Holy Cross Ministries" episodes={1} gradient="linear-gradient(140deg, #D8D4CC, #C0BCB4)" image="visual_elements/watch_tab/PatrickPayton_Pray.jpg" onClick={() => onTapSeries("pray-film")} />
            <WatchSeriesCard title="Mother Teresa: No Greater Love" host="Knights of Columbus" episodes={1} gradient="linear-gradient(140deg, #E4DCD0, #D0C8BC)" image="visual_elements/watch_tab/MotherTeresa_NoGreaterLove.jpg" onClick={() => onTapSeries("mother-teresa")} />
            <WatchSeriesCard title="The Face of Mercy" host="Knights of Columbus" episodes={1} gradient="linear-gradient(140deg, #DCD8D0, #C8C4BC)" image="visual_elements/watch_tab/FaceofMercy.jpg" onClick={() => onTapSeries("face-of-mercy")} />
            <WatchSeriesCard title="Apparition Hill" host="Holy Cross Ministries" episodes={1} gradient="linear-gradient(140deg, #E0DCD4, #C8C0B4)" image="visual_elements/watch_tab/ApparitionHill.jpg" onClick={() => onTapSeries("apparition-hill")} />
          </WatchScrollRow>
          <div style={{ height: 20 }} />
          </React.Fragment>
          )}
        </div>
      );
    };

    // ═══════════════════════════════════════════
    // VIDEO PLAYER — SHARED PRIMITIVES
    // ═══════════════════════════════════════════
    // Design tokens for the video player (dark mode)
    const vP = {
      bg: "#000",
      surface: "#1a1a1a",
      elevated: "#111",
      white: "#fff",
      text1: "#fff",
      text2: "#666",
      text3: "#999",
      accent: "#2563eb",
      liveRed: "#e53e3e",
      scrubTrack: "#333",
      iconColor: "#aaa",
      iconColorLand: "#888",
      backPillBg: "rgba(255,255,255,0.08)",
      postBg: "#0f1520",
    };

    // TASK 1: Player Status Bar
    // Dark-mode status bar with time, dynamic island notch, and signal bars.
    // Accepts `light` prop for light-mode variant (used in prayer modal context).
    const PlayerStatusBar = ({ light }) => (
      <div style={{
        height: 50, display: "flex", alignItems: "center",
        justifyContent: "space-between", padding: "0 28px", flexShrink: 0,
      }}>
        <span style={{
          color: light ? "#333" : "#888",
          fontSize: 14, fontWeight: 500, fontFamily: "system-ui",
        }}>9:41</span>
        <div style={{
          width: 80, height: 26,
          background: light ? "#eee" : "#111",
          borderRadius: 13,
        }} />
        <svg width={16} height={12} viewBox="0 0 16 12" fill="none">
          {[{ x: 0, y: 8, h: 4 }, { x: 4.5, y: 5, h: 7 }, { x: 9, y: 2, h: 10 }, { x: 13, y: 0, h: 12 }].map((r, i) => (
            <rect key={i} x={r.x} y={r.y} width="3" height={r.h} rx="0.5"
              fill={i < 3 ? (light ? "#333" : "#888") : (light ? "#ccc" : "#444")} />
          ))}
        </svg>
      </div>
    );

    // TASK 2: Back Button (Pill)
    // Translucent pill-shaped button with left chevron + "Back" text.
    // Used on Portrait, Live, and Landscape states.
    // Down arrow dismiss button — matches the green audio player pattern
    const PlayerDownArrow = ({ onClick }) => (
      <div onClick={onClick} style={{
        display: "flex", justifyContent: "center",
        paddingTop: 4, paddingBottom: 4, cursor: "pointer",
        flexShrink: 0,
      }}>
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none"
          stroke="rgba(255,255,255,0.6)" strokeWidth="2.5"
          strokeLinecap="round" strokeLinejoin="round">
          <polyline points="6 9 12 15 18 9" />
        </svg>
      </div>
    );

    // TASK 3: Video Tile
    // Full-width 16:9 video container with optional LIVE badge and fullscreen button.
    const PlayerFullscreenButton = ({ onClick, collapse }) => (
      <button onClick={onClick} style={{
        position: "absolute", bottom: 10, right: 10,
        width: 30, height: 30, background: vP.white,
        border: "none", borderRadius: 5, cursor: "pointer",
        display: "flex", alignItems: "center", justifyContent: "center",
      }}>
        <svg width={14} height={14} viewBox="0 0 24 24" fill="none" stroke="#000" strokeWidth="2.5">
          {collapse
            ? <><polyline points="4,14 10,14 10,20" /><polyline points="20,10 14,10 14,4" /><line x1="14" y1="10" x2="21" y2="3" /><line x1="3" y1="21" x2="10" y2="14" /></>
            : <><polyline points="15,3 21,3 21,9" /><polyline points="9,21 3,21 3,15" /><line x1="21" y1="3" x2="14" y2="10" /><line x1="3" y1="21" x2="10" y2="14" /></>
          }
        </svg>
      </button>
    );

    const PlayerVideoTile = ({ label = "Video Content", live, onFullscreen, onTapVideo, image, clip }) => (
      <div onClick={onTapVideo} style={{
        width: "100%", aspectRatio: "16/9", flexShrink: 0,
        position: "relative", cursor: onTapVideo ? "pointer" : "default",
        background: "linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 50%, #1a1a1a 100%)",
        display: "flex", alignItems: "center", justifyContent: "center",
        overflow: "hidden",
      }}>
        {clip && <video key={clip} src={clip} autoPlay loop muted playsInline style={{ position: "absolute", top: 0, left: 0, width: "100%", height: "100%", objectFit: "cover" }} />}
        {!clip && image && <img src={image} style={{ position: "absolute", top: 0, left: 0, width: "100%", height: "100%", objectFit: "cover" }} />}
        {!clip && !image && <div style={{
          color: "#444", fontSize: 13, fontFamily: "monospace",
          textTransform: "uppercase", letterSpacing: 2,
        }}>{label}{onTapVideo ? " · tap to end" : ""}</div>}
        {live && (
          <div style={{
            position: "absolute", top: 10, right: 10,
            background: vP.liveRed, borderRadius: 4,
            padding: "3px 8px", display: "flex", alignItems: "center", gap: 5,
          }}>
            <div style={{ width: 6, height: 6, background: vP.white, borderRadius: "50%" }} />
            <span style={{
              color: vP.white, fontSize: 10, fontWeight: 700,
              fontFamily: "system-ui", letterSpacing: "0.05em",
            }}>LIVE</span>
          </div>
        )}
        <PlayerFullscreenButton onClick={onFullscreen} />
      </div>
    );

    // TASK 4: Play/Pause Button
    // 60px white circle with play or pause icon. Toggles isPlaying state on click.
    const PlayerPlayPause = ({ isPlaying, onToggle }) => (
      <button onClick={onToggle} style={{
        width: 60, height: 60, borderRadius: "50%",
        background: vP.white, border: "none", cursor: "pointer",
        display: "flex", alignItems: "center", justifyContent: "center",
      }}>
        {isPlaying
          ? <svg width={24} height={24} viewBox="0 0 24 24" fill="#000">
              <rect x="6" y="4" width="4" height="16" rx="1" />
              <rect x="14" y="4" width="4" height="16" rx="1" />
            </svg>
          : <svg width={24} height={24} viewBox="0 0 24 24" fill="#000">
              <polygon points="7,3 21,12 7,21" />
            </svg>
        }
      </button>
    );

    // TASK 5: Skip Buttons (15s Back/Forward)
    // Circular arrow with "15s" label. viewBox -2 -2 28 28 prevents bottom curve clipping.
    const PlayerSkip = ({ fwd }) => (
      <button style={{
        background: "none", border: "none", cursor: "pointer",
        padding: 12, display: "flex", flexDirection: "column", alignItems: "center",
      }}>
        <svg width={34} height={34} viewBox="-2 -2 28 28" fill="none"
          stroke={vP.white} strokeWidth="1.8" strokeLinecap="round">
          {fwd
            ? <><path d="M23 4v6h-6" /><path d="M20.49 15a9 9 0 11-5.64-8.36L23 10" /></>
            : <><path d="M1 4v6h6" /><path d="M3.51 15a9 9 0 105.64-8.36L1 10" /></>
          }
        </svg>
        <span style={{
          fontSize: 13, fontWeight: 600, color: vP.text3,
          fontFamily: "system-ui", marginTop: 3,
        }}>15s</span>
      </button>
    );

    // TASK 6: Scrub Bar + Timestamps
    // Progress bar with handle and elapsed/remaining timestamps.
    const PlayerScrubBar = ({ progress = 35 }) => (
      <div style={{ padding: "18px 20px 6px", flexShrink: 0 }}>
        <div style={{ position: "relative", height: 6, background: vP.scrubTrack, borderRadius: 3 }}>
          <div style={{
            position: "absolute", left: 0, top: 0, height: "100%",
            width: `${progress}%`, background: vP.white, borderRadius: 3,
          }} />
          <div style={{
            position: "absolute", top: "50%", left: `${progress}%`,
            transform: "translate(-50%, -50%)",
            width: 14, height: 14, background: vP.white, borderRadius: "50%",
          }} />
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", marginTop: 8 }}>
          <span style={{ color: "#777", fontSize: 13, fontFamily: "system-ui", fontWeight: 500, fontVariantNumeric: "tabular-nums" }}>7:42</span>
          <span style={{ color: "#777", fontSize: 13, fontFamily: "system-ui", fontWeight: 500, fontVariantNumeric: "tabular-nums" }}>-14:26</span>
        </div>
      </div>
    );

    // TASK 7: Bottom Icon Row
    // Share + Prayer (conditional) + Sleep + Series (conditional).
    // Portrait: all 4 icons. Live: 3 icons (no prayer — it has its own button).
    const PlayerIconRow = ({ showAll = true, onPrayer }) => (
      <div style={{
        display: "flex", alignItems: "center", justifyContent: "space-evenly",
        padding: "0 20px 36px", flexShrink: 0,
      }}>
        {/* Share */}
        <button style={{ background: "none", border: "none", cursor: "pointer", padding: 10 }}>
          <svg width={22} height={22} viewBox="0 0 24 24" fill="none" stroke={vP.iconColor} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8" /><polyline points="16,6 12,2 8,6" /><line x1="12" y1="2" x2="12" y2="15" />
          </svg>
        </button>
        {/* Prayer — only shown when onPrayer provided */}
        {onPrayer && (
          <button onClick={onPrayer} style={{ background: "none", border: "none", cursor: "pointer", padding: 10 }}>
            <svg width={22} height={22} viewBox="0 0 24 24" fill="none" stroke={vP.iconColor} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" />
            </svg>
          </button>
        )}
        {/* Cast to TV */}

              <div style={{ position: "absolute", bottom: 24, left: 20, right: 20 }}>
                <div style={{ position: "relative", height: 4, background: "rgba(255,255,255,0.2)", borderRadius: 2 }}>
                  <div style={{ position: "absolute", left: 0, top: 0, height: "100%", width: "35%", background: vP.white, borderRadius: 2 }} />
                  <div style={{ position: "absolute", top: "50%", left: "35%", transform: "translate(-50%, -50%)", width: 10, height: 10, background: vP.white, borderRadius: "50%" }} />
                </div>
                <div style={{ display: "flex", justifyContent: "space-between", marginTop: 4 }}>
                  <span style={{ color: "#888", fontSize: 11, fontFamily: "system-ui", fontWeight: 500, fontVariantNumeric: "tabular-nums" }}>7:42</span>
                  <span style={{ color: "#888", fontSize: 11, fontFamily: "system-ui", fontWeight: 500, fontVariantNumeric: "tabular-nums" }}>-14:26</span>
                </div>
                <div style={{ display: "flex", justifyContent: "center", gap: 24, marginTop: 6 }}>
                  {/* Share */}
                  <button style={{ background: "none", border: "none", cursor: "pointer", padding: 4 }}>
                    <svg width={20} height={20} viewBox="0 0 24 24" fill="none" stroke="#888" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8" /><polyline points="16,6 12,2 8,6" /><line x1="12" y1="2" x2="12" y2="15" /></svg>
                  </button>
                  {/* Prayer */}
                  <button style={{ background: "none", border: "none", cursor: "pointer", padding: 4 }}>
                    <svg width={20} height={20} viewBox="0 0 24 24" fill="none" stroke="#888" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" /></svg>
                  </button>
                  {/* Sleep */}
                  <button style={{ background: "none", border: "none", cursor: "pointer", padding: 4 }}>
                    <svg width={20} height={20} viewBox="0 0 24 24" fill="none" stroke="#888" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" /></svg>
                  </button>
                  {/* Series — navigate to series page */}
                  <button onClick={(e) => { e.stopPropagation(); const sid = seriesNameToId[(videoPlayerData.series || "").toLowerCase()]; closeVideoPlayer(); setActiveTab("watch"); if (sid) goToWatchSeries(sid); }} style={{ background: "none", border: "none", cursor: "pointer", padding: 4 }}>
                    <svg width={20} height={20} viewBox="0 0 24 24" fill="none" stroke="#888" strokeWidth="2" strokeLinecap="round"><line x1="8" y1="6" x2="21" y2="6" /><line x1="8" y1="12" x2="21" y2="12" /><line x1="8" y1="18" x2="21" y2="18" /><line x1="3" y1="6" x2="3.01" y2="6" strokeWidth="3" /><line x1="3" y1="12" x2="3.01" y2="12" strokeWidth="3" /><line x1="3" y1="18" x2="3.01" y2="18" strokeWidth="3" /></svg>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ═══ LIVE PLAYER ═══ */}
          {videoPlayerOpen && videoPlayerData && playerMode === "live" && (
            <div style={{
              position: "absolute", top: 0, left: 0, right: 0, bottom: 0,
              zIndex: 200, background: vP.bg,
              display: "flex", flexDirection: "column",
            }}>
              <PlayerStatusBar />
              <PlayerDownArrow onClick={collapseToMini} />
              <div style={{ flex: 1 }} />
              <PlayerVideoTile label="Live Video" image={getSeriesImage(videoPlayerData.series)} clip={getLiveClip(videoPlayerData.series)} onTapVideo={() => setPlayerMode("postLive")} />
              <div style={{ flex: 1 }} />
              {/* Title + series name */}
              <div style={{ padding: "0 20px", flexShrink: 0 }}>
                <div style={{ color: vP.text1, fontSize: 19, fontWeight: 700, fontFamily: "system-ui", lineHeight: 1.25, letterSpacing: "-0.01em" }}>
                  {videoPlayerData.title}
                </div>
                <div style={{ color: vP.text2, fontSize: 13, fontFamily: "system-ui", marginTop: 4 }}>
                  {videoPlayerData.series}
                </div>
              </div>
              {/* Live indicator bar — thin line with red dot at right end */}
              <div style={{ padding: "18px 20px 10px", flexShrink: 0 }}>
                <div style={{ height: 3, background: vP.scrubTrack, borderRadius: 2, position: "relative" }}>
                  <div style={{ position: "absolute", right: 0, top: "50%", transform: "translateY(-50%)", width: 8, height: 8, background: vP.liveRed, borderRadius: "50%" }} />
                </div>
              </div>
              {/* Play/pause only — NO skip buttons */}
              <div style={{ display: "flex", alignItems: "center", justifyContent: "center", padding: "10px 20px 16px", flexShrink: 0 }}>
                <PlayerPlayPause isPlaying={isPlaying} onToggle={() => setIsPlaying(!isPlaying)} />
              </div>
              {/* Standalone prayer request button */}
              <div style={{ padding: "8px 30px 24px", flexShrink: 0 }}>
                <button onClick={() => setPrayerModalOpen(true)} style={{
                  width: "100%", padding: "14px 0", background: vP.white,
                  border: "none", borderRadius: 12, cursor: "pointer",
                  display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
                }}>
                  <svg width={16} height={16} viewBox="0 0 24 24" fill="none" stroke="#000" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" />
                  </svg>
                  <span style={{ color: "#000", fontSize: 14, fontFamily: "system-ui", fontWeight: 600 }}>Submit a Prayer Request</span>
                </button>
              </div>
              {/* Bottom icons — NO prayer icon (it has its own button above) */}
              <PlayerIconRow showAll={true} onPrayer={null} />
              {prayerModalOpen && <PlayerPrayerModal onClose={() => setPrayerModalOpen(false)} />}
            </div>
          )}

          {/* ═══ POST-LIVE END SCREEN ═══ */}
          {videoPlayerOpen && videoPlayerData && playerMode === "postLive" && (() => {
            const { prayerId, isSet } = getLiveReminderState();
            // Special event (no prayer reminder) has no "remind me" card, so always offer the share card.
            const showShareCard = endScreenInitialSet || !prayerId;
            const shareNoun = !prayerId ? "Broadcast"
              : videoPlayerData.series === "Family Rosary Across America" ? "Rosary"
              : videoPlayerData.series === "Divine Mercy Chaplet" ? "Chaplet"
              : videoPlayerData.series === "Daily Mass" ? "Mass"
              : videoPlayerData.series;
            return (
            <div style={{
              position: "absolute", top: 0, left: 0, right: 0, bottom: 0,
              zIndex: 200, background: vP.postBg,
              display: "flex", flexDirection: "column", overflow: "auto",
            }}>
              <PlayerStatusBar />
              {/* Down arrow — collapse to mini (same as player, unified behavior) */}
              <PlayerDownArrow onClick={collapseToMini} />
              {/* Header */}
              <div style={{ padding: "24px 20px 0", flexShrink: 0, textAlign: "center" }}>
                <div style={{ fontSize: 12, color: "rgba(255,255,255,0.35)", fontFamily: "system-ui", fontWeight: 600, letterSpacing: "0.08em", textTransform: "uppercase", marginBottom: 8 }}>Stream Ended</div>
                <div style={{ fontSize: 34, fontWeight: 800, color: "#fff", fontFamily: "system-ui", lineHeight: 1.1, letterSpacing: "-0.02em" }}>Thank you for praying with us!</div>
              </div>
              {/* Reminder card — matches watch tab horizontal row. Only shown when reminder was NOT set at screen open. */}
              {prayerId && !endScreenInitialSet && (() => {
                const prayer = WATCH_PRAYERS.find(pr => pr.id === prayerId);
                const rowMeta = { mass: { title: "Mass", img: "rr_shows/reminder_cards/Mass.png" }, chaplet: { title: "Chaplet", img: "rr_shows/reminder_cards/divine_mercy.jpg" }, rosary: { title: "Rosary", img: "rr_shows/reminder_cards/Rosary.png" } }[prayerId];
                return (
                <div style={{ padding: "28px 20px 0", flexShrink: 0 }}>
                  <div style={{ fontSize: 16, color: "rgba(255,255,255,0.85)", fontFamily: "system-ui", fontWeight: 500, textAlign: "center", marginBottom: 10 }}>Pray with us again tomorrow</div>
                  <div onClick={() => toggleReminder(prayerId)}
                    role="button" aria-pressed={isSet ? "true" : "false"}
                    style={{ cursor: "pointer", userSelect: "none", background: "#fff", borderRadius: 14, minHeight: 60, display: "flex", alignItems: "stretch", gap: 12, paddingRight: 14, overflow: "hidden", boxShadow: "0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04)", transition: "all 0.2s ease" }}>
                    {/* Identity image (left, bleeds to edges) */}
                    <div style={{ width: 60, alignSelf: "stretch", flexShrink: 0, overflow: "hidden" }}>
                      <img src={rowMeta.img} style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} />
                    </div>
                    {/* Text block */}
                    <div style={{ flex: 1, display: "flex", flexDirection: "column", justifyContent: "center", gap: 2, padding: "4px 0", minWidth: 0 }}>
                      <p style={{ margin: 0, fontFamily: "'DM Sans', sans-serif", fontSize: 15, fontWeight: 600, color: "#000", lineHeight: 1.15 }}>{rowMeta.title}</p>
                      <p style={{ margin: 0, fontFamily: "'DM Sans', sans-serif", fontSize: 14, fontWeight: 500, color: "#666", lineHeight: 1.15 }}>{prayer ? prayer.time : ""}</p>
                    </div>
                    {/* Bell action pill */}
                    <div style={{ height: 34, borderRadius: 17, background: isSet ? "#e6f3eb" : "#f0f0f3", display: "flex", alignItems: "center", justifyContent: "center", gap: 6, padding: "0 12px", flexShrink: 0, alignSelf: "center", transition: "all 0.2s ease" }}>
                      {isSet ? (
                        <svg width={16} height={16} viewBox="0 0 24 24" fill="#2d8a4e"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" /><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" /></svg>
                      ) : (
                        <svg width={16} height={16} viewBox="0 0 24 24" fill="none" stroke="#1c1c1e" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" /><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" /></svg>
                      )}
                      <span style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 14, fontWeight: 600, color: isSet ? "#2d8a4e" : "#1c1c1e" }}>{isSet ? "Reminder set" : "Remind me"}</span>
                    </div>
                  </div>
                </div>
                );
              })()}
              {/* Share card — shown when reminder was ALREADY set, or for a special event (no reminder). */}
              {showShareCard && (
              <div style={{ padding: "28px 20px 0", flexShrink: 0 }}>
                <div style={{ fontSize: 16, color: "rgba(255,255,255,0.85)", fontFamily: "system-ui", fontWeight: 500, textAlign: "center", marginBottom: 10 }}>Share the {shareNoun} with a friend</div>
                <div style={{ background: "#fff", borderRadius: 16, overflow: "hidden" }}>
                  {(() => {
                    const isWideLogo = (videoPlayerData.series || "").toLowerCase().includes("relevant radio live");
                    const img = getSeriesImage(videoPlayerData.series);
                    return (
                  <div style={{ width: "100%", aspectRatio: "16/9", background: isWideLogo ? "#44628f" : "#ddd", display: "flex", alignItems: "center", justifyContent: "center", position: "relative", overflow: "hidden", padding: isWideLogo ? "0 12%" : 0, boxSizing: "border-box" }}>
                    {img
                      ? (isWideLogo
                          ? <img src={img} style={{ maxWidth: "100%", maxHeight: "100%", width: "auto", height: "auto", objectFit: "contain", display: "block" }} />
                          : <img src={img} style={{ position: "absolute", top: 0, left: 0, width: "100%", height: "100%", objectFit: "cover" }} />)
                      : <svg width={28} height={28} viewBox="0 0 24 24" fill="#bbb"><polygon points="6,3 20,12 6,21" /></svg>
                    }
                  </div>
                    );
                  })()}
                  <div style={{ padding: "12px 14px 14px" }}>
                    <div style={{ color: "#111", fontSize: 15, fontWeight: 700, fontFamily: "system-ui", lineHeight: 1.3 }}>{videoPlayerData.title}</div>
                    <div style={{ color: "#888", fontSize: 12, fontFamily: "system-ui", marginTop: 3 }}>{videoPlayerData.series}</div>
                    <button style={{ marginTop: 12, width: "100%", padding: "13px 0", background: vP.accent, border: "none", borderRadius: 10, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
                      <svg width={16} height={16} viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                        <path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8" /><polyline points="16,6 12,2 8,6" /><line x1="12" y1="2" x2="12" y2="15" />
                      </svg>
                      <span style={{ color: "#fff", fontSize: 14, fontWeight: 600, fontFamily: "system-ui" }}>Share {shareNoun}</span>
                    </button>
                  </div>
                </div>
              </div>
              )}
              {/* Back to Live Broadcast button */}
              <div style={{ padding: "32px 20px 0", flexShrink: 0 }}>
                <button onClick={triggerLive} style={{
                  width: "100%", padding: "14px 0",
                  background: "transparent",
                  border: "1px solid rgba(255,255,255,0.2)",
                  borderRadius: 12, cursor: "pointer",
                  display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
                }}>
                  <div style={{ width: 7, height: 7, background: vP.liveRed, borderRadius: "50%" }} />
                  <span style={{ color: "#fff", fontSize: 14, fontWeight: 600, fontFamily: "system-ui" }}>Back to Live Broadcast</span>
                </button>
              </div>
              <div style={{ flex: 1 }} />
            </div>
            );
          })()}

          {/* ═══ POST-VIDEO SCREEN ═══ */}
          {videoPlayerOpen && videoPlayerData && playerMode === "postVideo" && (
            <div style={{
              position: "absolute", top: 0, left: 0, right: 0, bottom: 0,
              zIndex: 200, background: vP.postBg,
              display: "flex", flexDirection: "column", overflow: "hidden",
            }}>
              <PlayerStatusBar />
              {/* Down arrow — collapse to mini (same as player, unified behavior) */}
              <PlayerDownArrow onClick={collapseToMini} />
              {signedIn ? (<>
                {/* Share prompt (signed in — unchanged) */}
                <div style={{ padding: "24px 20px 0", flexShrink: 0, textAlign: "center" }}>
                  <div style={{ fontSize: 12, color: "rgba(255,255,255,0.35)", fontFamily: "system-ui", fontWeight: 600, letterSpacing: "0.08em", textTransform: "uppercase", marginBottom: 8 }}>Episode Complete</div>
                  <div style={{ fontSize: 34, fontWeight: 800, color: "#fff", fontFamily: "system-ui", lineHeight: 1.1, letterSpacing: "-0.02em" }}>Loved it?</div>
                  <div style={{ fontSize: 18, color: "rgba(255,255,255,0.8)", fontFamily: "system-ui", marginTop: 6, fontWeight: 500 }}>Share it with a friend or family!</div>
                </div>
                {/* Share card */}
                <div style={{ padding: "20px 20px 0", flexShrink: 0 }}>
                  <div style={{ background: "#fff", borderRadius: 16, overflow: "hidden" }}>
                    <div style={{ width: "100%", aspectRatio: "16/9", background: "#ddd", display: "flex", alignItems: "center", justifyContent: "center", position: "relative", overflow: "hidden" }}>
                      {getSeriesImage(videoPlayerData.series)
                        ? <img src={getSeriesImage(videoPlayerData.series)} style={{ position: "absolute", top: 0, left: 0, width: "100%", height: "100%", objectFit: "cover" }} />
                        : <svg width={28} height={28} viewBox="0 0 24 24" fill="#bbb"><polygon points="6,3 20,12 6,21" /></svg>
                      }
                    </div>
                    <div style={{ padding: "12px 14px 14px" }}>
                      <div style={{ color: "#111", fontSize: 15, fontWeight: 700, fontFamily: "system-ui", lineHeight: 1.3 }}>{videoPlayerData.title}</div>
                      <div style={{ color: "#888", fontSize: 12, fontFamily: "system-ui", marginTop: 3 }}>{videoPlayerData.series}</div>
                      <button style={{ marginTop: 12, width: "100%", padding: "13px 0", background: vP.accent, border: "none", borderRadius: 10, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
                        <svg width={16} height={16} viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                          <path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8" /><polyline points="16,6 12,2 8,6" /><line x1="12" y1="2" x2="12" y2="15" />
                        </svg>
                        <span style={{ color: "#fff", fontSize: 14, fontWeight: 600, fontFamily: "system-ui" }}>Share Video</span>
                      </button>
                    </div>
                  </div>
                </div>
              </>) : (<>
                {/* Signed out: one blue card carries the whole account ask (PRD §5: end-of-video is the highest-intent moment) */}
                <div style={{ padding: "24px 20px 0", flexShrink: 0, textAlign: "center" }}>
                  <div style={{ fontSize: 12, color: "rgba(255,255,255,0.35)", fontFamily: "system-ui", fontWeight: 600, letterSpacing: "0.08em", textTransform: "uppercase" }}>Episode Complete</div>
                </div>
                {/* Account hero card */}
                <div style={{ padding: "16px 20px 0", flexShrink: 0 }}>
                  <div onClick={() => openJoinSheet({ type: "context", headline: "Never lose your place" })} style={{ borderRadius: 16, overflow: "hidden", cursor: "pointer", padding: "26px 22px 22px", background: "linear-gradient(135deg, #4a7fb3 0%, #3b6fa0 55%, #2d5680 100%)", boxShadow: "0 10px 26px rgba(0,0,0,0.35)", textAlign: "center" }}>
                    <div style={{ width: 44, height: 44, borderRadius: "50%", background: "rgba(255,255,255,0.2)", display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 12px" }}>
                      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    </div>
                    <div style={{ fontFamily: "'DM Sans', system-ui, sans-serif", fontSize: 25, fontWeight: 800, color: "#fff", lineHeight: 1.2, letterSpacing: -0.3 }}>Create your free account</div>
                    <div style={{ fontFamily: "'DM Sans', system-ui, sans-serif", fontSize: 13, color: "rgba(255,255,255,0.92)", fontWeight: 500, lineHeight: 1.5, margin: "8px 0 18px" }}>Always free. We'll remember where you stopped — and pick up right there next time.</div>
                    <div style={{ display: "flex", alignItems: "center", justifyContent: "center", background: "#fff", borderRadius: 999, padding: "13px 0" }}>
                      <span style={{ fontFamily: "'DM Sans', system-ui, sans-serif", fontSize: 16, fontWeight: 800, color: "#3b6fa0" }}>Sign up or log in</span>
                    </div>
                  </div>
                </div>
                {/* Share — thin rounded-rect button, white */}
                <div style={{ padding: "16px 20px 0", flexShrink: 0 }}>
                  <button style={{ width: "100%", padding: "12px 0", background: "#fff", border: "none", borderRadius: 10, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
                    <svg width={15} height={15} viewBox="0 0 24 24" fill="none" stroke="#111" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8" /><polyline points="16,6 12,2 8,6" /><line x1="12" y1="2" x2="12" y2="15" /></svg>
                    <span style={{ color: "#111", fontSize: 14, fontWeight: 600, fontFamily: "system-ui" }}>Share this video</span>
                  </button>
                </div>
              </>)}
              {/* Next Up card */}
              <div style={{ padding: signedIn ? "16px 20px 0" : "26px 20px 0", flexShrink: 0 }}>
                <div onClick={() => { setVideoPlayerData({ title: "Fatherhood", series: videoPlayerData.series }); setPlayerMode("portrait"); setIsPlaying(true); }} style={{ display: "flex", gap: 12, background: "#fff", borderRadius: 14, cursor: "pointer", padding: 10, alignItems: "center" }}>
                  <div style={{ width: 100, height: 60, background: "#ddd", borderRadius: 8, flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center", position: "relative", overflow: "hidden" }}>
                    {getSeriesImage(videoPlayerData.series)
                      ? <img src={getSeriesImage(videoPlayerData.series)} style={{ position: "absolute", top: 0, left: 0, width: "100%", height: "100%", objectFit: "cover" }} />
                      : <svg width={16} height={16} viewBox="0 0 24 24" fill="#bbb"><polygon points="6,3 20,12 6,21" /></svg>
                    }
                  </div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ color: "#999", fontSize: 10, fontWeight: 600, fontFamily: "system-ui", textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 3 }}>Next Up</div>
                    <div style={{ color: "#111", fontSize: 13, fontWeight: 600, fontFamily: "system-ui", lineHeight: 1.3 }}>Fatherhood</div>
                    <div style={{ color: "#888", fontSize: 11, fontFamily: "system-ui", marginTop: 2 }}>{videoPlayerData.series}</div>
                  </div>
                  {/* Countdown timer ring */}
                  <div style={{ width: 44, height: 44, flexShrink: 0, position: "relative", display: "flex", alignItems: "center", justifyContent: "center" }}>
                    <svg width={44} height={44} viewBox="0 0 44 44" style={{ position: "absolute", transform: "rotate(-90deg)" }}>
                      <circle cx="22" cy="22" r="19" fill="none" stroke="rgba(37,99,235,0.2)" strokeWidth="3" />
                      <circle cx="22" cy="22" r="19" fill="none" stroke={vP.accent} strokeWidth="3"
                        strokeDasharray={`${2 * Math.PI * 19}`} strokeDashoffset={`${2 * Math.PI * 19 * 0.85}`} strokeLinecap="round" />
                    </svg>
                    <div style={{ width: 34, height: 34, background: vP.accent, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center" }}>
                      <svg width={13} height={13} viewBox="0 0 24 24" fill="#fff"><polygon points="7,3 21,12 7,21" /></svg>
                    </div>
                  </div>
                </div>
              </div>
              <div style={{ flex: 1 }} />
            </div>
          )}


        </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AudiobooksApp />);
  </script>
</body>
</html>
