<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef0f3"/>
    </linearGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#0a1929" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- squircle canvas -->
  <rect x="100" y="100" width="824" height="824" rx="186"
        fill="url(#bg)" stroke="#d7d9de" stroke-width="5" filter="url(#ds)"/>

  <!-- copy glyph: back square -->
  <rect x="318" y="288" width="352" height="352" rx="74"
        fill="none" stroke="#c3c6cc" stroke-width="38"/>

  <!-- copy glyph: front square (occludes back) -->
  <rect x="408" y="378" width="352" height="352" rx="74"
        fill="#ffffff" stroke="#7e828a" stroke-width="38"/>
</svg>
